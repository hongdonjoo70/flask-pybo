{% extends 'base.html' %}
{% block content %}
<div class="container">
    <h5 class="my-3 border-bottom pb-2">답변수정</h5>
    <form method="post" class="my-3">
        {{ form.csrf_token() }}
        {% include "form_errors.html" %}
        <div class="mb-3">
            {{ form.content.label }}
            {{ form.content(class="form-control mb-3", rows="5") }}
            {{ form.submit(class="btn btn-primary my-3") }}
        </div>
    </form>
</div>
{% endblock %}
